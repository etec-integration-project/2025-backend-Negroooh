name: Generar y Subir Documentación

on:
  push:
    branches:
      - main  # Se ejecuta cuando haces un push en la rama `main`

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Clonar el repositorio
      - name: Clonar el repositorio
        uses: actions/checkout@v2

      # Paso 2: Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'  # Puedes cambiar la versión de Node.js si es necesario

      # Paso 3: Instalar dependencias
      - name: Instalar dependencias
        run: npm install

      # Paso 4: Generar la documentación con JSDoc
      - name: Generar documentación con JSDoc
        run: npm run docs

      # Paso 5: Subir documentación a la rama `wiki`
      - name: Subir documentación a la rama `wiki`
        run: |
          # Crear la rama wiki (o actualizarla si ya existe)
          git checkout --orphan wiki  # Crea una rama sin historial
          git rm -rf .  # Elimina archivos existentes
          cp -r docs/* .  # Copia los archivos generados en la carpeta docs
          git add .  # Agregar los archivos generados
          git commit -m "Actualizar documentación"  # Commit de los cambios
          git push origin wiki --force  # Subir a la rama `wiki`

